[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kneescope12"
version = "0.1.0"
description = "I provide foundation infrastructure for reproducible knee MRI abnormality research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "KneeScope-12" }]
dependencies = [
    "numpy>=1.26",
    "pydicom>=2.4",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "langdetect>=1.0.9",
    "psutil>=5.9",
    "torch>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
kneescope12-audit = "kneescope12.data.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
