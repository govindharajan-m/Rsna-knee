# Small MRI-only baseline settings for the 58 explicitly labeled training studies.
seed: 2026

paths:
  dataset_root: null
  labels_csv: null
  series_csv: null
  audit_output: experiments/dataset_audit
  experiment_root: experiments
  cache_root: cache
  manifest_output: experiments/manifests/study_manifest.parquet
  qc_output: experiments/qc
  checkpoint: experiments/baseline/checkpoint.pt

image:
  target_shape: [24, 96, 96]

model:
  name: small_3d_cnn
  base_channels: 8

training:
  enabled: true
  batch_size: 1
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001

validation:
  fraction: 0.2

logging:
  level: INFO

labels:
  - ACL
  - MCL
  - Medial Meniscus
  - Lateral Meniscus
  - Medial OA
  - Lateral OA
  - PF OA
  - Effusion
  - Synovitis
  - Baker's
  - Contusion
  - Fracture

baseline:
  # I keep fixed channels in acquisition-plane slots and never rank by image quality.
  plane_order: [Axial, Coronal, Sagittal]
  max_series_per_study: 3
  target_shape: [24, 96, 96]
  preprocessing:
    lower_percentile: 0.5
    upper_percentile: 99.5
    interpolation_order: 1

audit:
  scan_all_files: false
  dicom_extensions: [".dcm", ".dicom", ".ima", ""]
  expected_dimensions: null
  pixel_spacing_range_mm: null
  max_error_samples: 100

preprocessing:
  # These settings belong to the separate legacy preparation/QC path, not train_baseline.py.
  version: preprocess_v001
  normalization:
    method: percentile_minmax
    lower_percentile: 0.5
    upper_percentile: 99.5
  resampling:
    target_spacing_mm: null
    target_size: null
    interpolation_order: 1
  roi:
    method: foreground_quantile
    foreground_quantile: 0.60
    margin_pixels: 12
    minimum_area_fraction: 0.02
